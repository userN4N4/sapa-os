<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPA.OS</title>
<style>
  body {
    margin: 0; background: black; color: #00ff66;
    font-family: "Courier New", monospace; font-size: 18px; line-height: 1.4;
  }
  #start {
    position: fixed; inset: 0; background: black;
    display: flex; align-items: center; justify-content: center; z-index: 9999;
  }
  #start button {
    font-size: 20px; padding: 20px 26px; background: #00ff66;
    border: none; font-weight: bold; text-transform: uppercase; cursor: pointer;
  }
  #terminal { padding: 20px; white-space: pre-wrap; word-wrap: break-word; padding-bottom: 50px; }
  #cursor { display: inline-block; width: 10px; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  #buttons { display: none; max-width: 900px; margin: 0 auto; padding: 0 20px 50px 20px; }
  .button {
    display: block; margin: 16px 0; padding: 16px;
    border: 1px solid #00ff66; color: #00ff66; background: black;
    text-decoration: none; text-align: center; font-size: 18px;
  }
  .button:active { background: #00ff66; color: black; }
</style>
</head>
<body>

<div id="start">
  <button id="btnInit">INICIALIZAR PROTOCOLO SAPA</button>
</div>

<!-- Audios com fontes alternativas mais estáveis -->
<audio id="bootSound" src="https://assets.mixkit.co"></audio>
<audio id="modemSound" src="https://www.soundjay.com"></audio>
<audio id="keySound" src="https://www.soundjay.com"></audio>

<div id="terminal"><span id="text"></span><span id="cursor">_</span></div>

<div id="buttons">
  <a class="button" href="https://www.instagram.com" target="_blank">1) PERFIL DA USUÁRIA</a>
  <a class="button" href="https://www.instagram.com" target="_blank">2) PERFIL DA BLOCA</a>
  <a class="button" href="https://tellonym.me" target="_blank">3) MENSAGENS PARA O FUTURO</a>
  <a class="button" href="https://twitch.tv" target="_blank">4) TRANSMISSÃO AO VIVO</a>
</div>

<script>
const fullContent = `SAPA.OS v6.8.6...
Iniciando sistema...

[ OK ] Tudo_sapa.exe carregado
[ OK ] Motor de Afeto inicializado
[ OK ] Camada de Gerenciamento de Desejo online

SINCRONIZANDO CURITIBA-DELTA...
----------------------------------------
[ PERFIL DE USUÁRIA ]
ID: TEST_USER.N4N4
Classe: Nativa com Upgrade Lésbico.
Especialização: Música / Agitação Cultural.

[ LOG DE EXPANSÃO ]
> Núcleo Sapa expandindo.
> TUDO SAPA: estado final estável.

Selecione uma interface:`;

let i = 0;
const speed = 40; 
const textEl = document.getElementById("text");
const bootSound = document.getElementById("bootSound");
const modemSound = document.getElementById("modemSound");
const keySound = document.getElementById("keySound");
let isAutoScrolling = true;

// Evento de clique unificado para destravar áudio no navegador
document.getElementById("btnInit").addEventListener("click", function() {
  document.getElementById("start").style.display = "none";
  
  // "Acorda" os áudios
  bootSound.play();
  modemSound.load();
  keySound.load();

  setTimeout(() => {
    modemSound.play();
    setTimeout(typeWriter, 2500); 
  }, 1000);
});

window.addEventListener('scroll', () => {
  const isAtBottom = window.innerHeight + window.scrollY >= document.body.offsetHeight - 100;
  isAutoScrolling = isAtBottom;
});

function typeWriter() {
  if (i < fullContent.length) {
    const char = fullContent.charAt(i);
    textEl.textContent += char;
    i++;

    // Toca som de tecla clonando o áudio (permite sobreposição rápida)
    if (char !== " " && char !== "\n") {
      let soundClone = keySound.cloneNode();
      soundClone.volume = 0.15;
      soundClone.play().catch(() => {});
    }

    if (isAutoScrolling) {
      window.scrollTo(0, document.body.scrollHeight);
    }

    setTimeout(typeWriter, speed);
  } else {
    document.getElementById("buttons").style.display = "block";
    document.getElementById("cursor").style.display = "none";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
}
</script>
</body>
</html>
