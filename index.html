<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPA.OS Terminal Compact</title>

<style>
html, body {
  margin: 0;
  padding: 0;
  background: black;
  color: #00ff66;
  font-family: "Courier New", monospace;
  font-size: 14px; /* Fonte aumentada */
  line-height: 1.1;
  overflow-y: auto; /* Scroll manual visível */
}

/* Barra de rolagem discreta */
body::-webkit-scrollbar {
  width: 8px;
}
body::-webkit-scrollbar-track {
  background: black;
}
body::-webkit-scrollbar-thumb {
  background-color: #00ff66;
  border-radius: 4px;
  border: 1px solid black;
}
body {
  scrollbar-width: thin;
  scrollbar-color: #00ff66 black;
}

#start {
  position: fixed;
  inset: 0;
  background: black;
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 9999;
}

#start button {
  font-size: 16px;
  padding: 12px 18px;
  background: #00ff66;
  border: none;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
}

#terminal {
  padding: 10px;
  white-space: pre-wrap;
}

#cursor {
  display: inline-block;
  width: 8px;
  animation: blink 1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50% { opacity: 0; }
}

/* Botões compactos em linha, com numeração visível */
#buttons {
  display: none;
  margin-top: 8px;
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
}

.button {
  padding: 4px 6px;
  border: 1px solid #00ff66;
  color: #00ff66;
  background: black;
  text-decoration: none;
  text-align: center;
  font-size: 12px;
}

.button:active {
  background: #00ff66;
  color: black;
}
</style>
</head>
<body>

<div id="start">
  <button onclick="startSystem()">INICIALIZAR PROTOCOLO SAPA</button>
</div>

<div id="terminal">
  <span id="text"></span><span id="cursor">_</span>

  <div id="buttons">
    <a class="button" onclick="vibe()" href="https://www.instagram.com/canta_nana" target="_blank">1) PERFIL DA USUÁRIA</a>
    <a class="button" onclick="vibe()" href="https://www.instagram.com/saidoarmarioemedeibem" target="_blank">2) PERFIL DA BLOCA</a>
    <a class="button" onclick="vibe()" href="https://tellonym.me/test_user.n4n4" target="_blank">3) ESCREVA MENSAGENS PARA O FUTURO</a>
    <a class="button" onclick="vibe()" href="https://twitch.tv/canta_nana" target="_blank">4) TRANSMISSÃO AO VIVO - VISUALIZAR CÂMERA DA USUÁRIA</a>
  </div>
</div>

<script>
const content = `SAPA.OS v6.8.6
Iniciando sistema...

[ OK ] Tudo_sapa.exe carregado
[ OK ] Motor de Afeto inicializado
[ OK ] Camada de Gerenciamento de Desejo online
[ OK ] Protocolos de Corpo Livre ativos
[ OK ] Interfaces com Mundo Legado montadas

Sincronizando território: CURITIBA-DELTA...

[ AVISO ] Estruturas normativas ainda detectadas
[ INFO ] Módulos de desconstrução disponíveis

Carregando perfil de usuária...
> TEST_USER.N4N4

Classe: Nativa
Permissões: ESTENDIDAS

Especialização:
Música / Agitação Cultural / Lubrificação e Manuseio de Fluidos / Mapeamento Térmico / Testagem de Vibrações e Sucções

Verificando índice de convergência...
> ÍNDICE_GLOBAL_SAPA: 0.69

Carregando módulos de migração...
Iniciando shell do sistema...

> _
`;

let i = 0;
const speed = 15;
const textEl = document.getElementById("text");
const buttons = document.getElementById("buttons");

// Sons via Web Audio
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playBootSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(440, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.25);
}

function playRobotSound() {
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle';
  osc.frequency.setValueAtTime(600 + Math.random() * 200, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + 0.12);
}

function startSystem() {
  document.getElementById("start").style.display = "none";
  playBootSound();
  setTimeout(() => playRobotSound(), 300);
  if (navigator.vibrate) navigator.vibrate([200,100,200,100,400]);
  typeWriter();
}

function typeWriter() {
  if (i < content.length) {
    textEl.textContent += content.charAt(i);
    i++;
    setTimeout(typeWriter, speed);
  } else {
    buttons.style.display = "flex"; // Mostra botões em linha
  }
}

function vibe() {
  if (navigator.vibrate) navigator.vibrate(60);
}
</script>

</body>
</html>
