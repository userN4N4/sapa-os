<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SAPA.OS</title>
<style>
  body { margin: 0; background: black; color: #00ff66; font-family: "Courier New", monospace; font-size: 18px; line-height: 1.4; overflow-x: hidden; }
  #start { position: fixed; inset: 0; background: black; display: flex; align-items: center; justify-content: center; z-index: 9999; }
  #start button { font-size: 20px; padding: 20px 26px; background: #00ff66; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; }
  #terminal { padding: 20px; white-space: pre-wrap; word-wrap: break-word; padding-bottom: 50px; }
  #cursor { display: inline-block; width: 10px; background: #00ff66; animation: blink 1s infinite; }
  @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
  #buttons { display: none; max-width: 900px; margin: 0 auto; padding: 0 20px 50px 20px; }
  .button { display: block; margin: 16px 0; padding: 16px; border: 1px solid #00ff66; color: #00ff66; background: black; text-decoration: none; text-align: center; font-size: 18px; }
  .button:active { background: #00ff66; color: black; }
</style>
</head>
<body>

<div id="start">
  <button id="btnInit">INICIALIZAR PROTOCOLO SAPA</button>
</div>

<!-- Áudios públicos e diretos -->
<audio id="bootSound" src="https://cdn.pixabay.com/audio/2021/09/07/audio_61e2bb99ed.mp3"></audio>
<audio id="modemSound" src="https://cdn.pixabay.com/audio/2022/03/15/audio_0288be5286.mp3"></audio>
<audio id="keySound1" src="https://cdn.pixabay.com/audio/2021/09/14/audio_b9a0c9c84e.mp3"></audio>
<audio id="keySound2" src="https://cdn.pixabay.com/audio/2021/09/14/audio_c1e0c7f8c1.mp3"></audio>
<audio id="keySound3" src="https://cdn.pixabay.com/audio/2021/09/14/audio_3f2d6c8f1a.mp3"></audio>

<div id="terminal"><span id="text"></span><span id="cursor">&nbsp;</span></div>

<div id="buttons">
  <a class="button" href="https://www.instagram.com" target="_blank">1) PERFIL DA USUÁRIA</a>
  <a class="button" href="https://www.instagram.com" target="_blank">2) PERFIL DA BLOCA</a>
  <a class="button" href="https://tellonym.me" target="_blank">3) MENSAGENS PARA O FUTURO</a>
  <a class="button" href="https://twitch.tv" target="_blank">4) TRANSMISSÃO AO VIVO</a>
</div>

<script>
const fullContent = `SAPA.OS v6.8.6...
Iniciando sistema...

[ OK ] Tudo_sapa.exe carregado
[ OK ] Motor de Afeto inicializado
[ OK ] Camada de Gerenciamento de Desejo online

SINCRONIZANDO CURITIBA-DELTA...
----------------------------------------
[ PERFIL DE USUÁRIA ]
ID: TEST_USER.N4N4
Classe: Nativa com Upgrade Lésbico.
Especialização: Música / Agitação Cultural.

[ LOG DE EXPANSÃO ]
> Núcleo Sapa expandindo.
> TUDO SAPA: estado final estável.

Selecione uma interface:`;

let i = 0;
const speed = 40; 
const textEl = document.getElementById("text");
const bootSound = document.getElementById("bootSound");
const modemSound = document.getElementById("modemSound");
const keySounds = [
  document.getElementById("keySound1"),
  document.getElementById("keySound2"),
  document.getElementById("keySound3")
];

document.getElementById("btnInit").addEventListener("click", function() {
  document.getElementById("start").style.display = "none";

  // Tocar boot
  bootSound.currentTime = 0;
  bootSound.volume = 0.6;
  bootSound.play().then(() => {
    // Após boot tocar modem e iniciar digitação
    modemSound.currentTime = 0;
    modemSound.volume = 0.2;
    modemSound.play();
    typeWriter();
  }).catch(e => console.log("Erro ao tocar áudio:", e));
});

function typeWriter() {
  if (i < fullContent.length) {
    const char = fullContent.charAt(i);
    textEl.textContent += char;
    i++;

    // Som de tecla aleatório
    if (char !== " " && char !== "\n") {
      const randomKey = keySounds[Math.floor(Math.random() * keySounds.length)].cloneNode();
      randomKey.volume = 0.12;
      randomKey.play().catch(e => {});
    }

    window.scrollTo(0, document.body.scrollHeight);
    setTimeout(typeWriter, speed);
  } else {
    document.getElementById("buttons").style.display = "block";
    document.getElementById("cursor").style.display = "none";
    window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
  }
}
</script>
</body>
</html>
